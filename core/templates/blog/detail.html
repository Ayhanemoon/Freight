<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail</title>
</head>
<body>
    <h2>{{post.title}}</h2>
    <p>Created by {{post.author.first_name}} {{post.author.last_name}}</p>
    <p>Published at: {{post.published_at}}</p>
    <div>
        {{post.content}}
    </div>
</body>
</html>
